# Production compose (Lot 2 of the deployment chantier, SMA-41).
# Model: same-origin edge — Traefik terminates TLS on 80/443 (the ONLY
# published ports in this file) and routes /api, /signin-google and /health
# to the api, everything else to the static web image. Images are PULLED
# from GHCR by ${IMAGE_TAG} — never built on the 1-vCPU VPS. Secrets come
# from the VPS-only .env (chmod 600); every required variable fails fast by
# name via ${VAR:?} — deliberate here (prod reads .env; the dev compose's
# rejection of :? was about the override-file supply route and stays dev-only).
# The dev docker-compose.yml is untouched by this file.

networks:
  default:
    ipam:
      config:
        # The exact subnet ForwardedHeaders__KnownNetworks__0 trusts below:
        # pinned so the proxy boundary is a contract, not a Docker default.
        - subnet: 172.28.0.0/16

# SMA-348 (log half): every service gets bounded json-file rotation — the
# rotation IS the purge the privacy policy's log claim rests on.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  traefik:
    image: traefik:v3.3
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:?ACME_EMAIL is required (Let's Encrypt account email)}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      # SMA-348: access logs ON, JSON — the privacy policy's "we log
      # requests" becomes true, and the x-logging rotation bounds them.
      - --accesslog=true
      - --accesslog.format=json
      - --log.level=INFO
      - --ping=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging: *default-logging

  api:
    # Lowercase owner — GHCR requires it.
    image: ghcr.io/alexandre-cerveau-audebeau/smartcrops-api:${IMAGE_TAG:?IMAGE_TAG is required (GHCR image tag to deploy)}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # The DISCRETE database path the Lot 1 resolver waits for — no
      # ConnectionStrings entry anywhere in this file: the builder quotes
      # the generated password, and IsConfigured arms the fail-fast guards.
      Database__Host: db
      Database__Port: "5432"
      Database__Name: smartcrops
      Database__User: smartcrops
      Database__Password: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (database password, VPS .env only)}
      DataProtection__KeysPath: /keys
      ForwardedHeaders__KnownNetworks__0: 172.28.0.0/16
      Frontend__BaseUrl: https://smartcrops.fr
      Cors__AllowedOrigins__0: https://smartcrops.fr
      Jwt__Key: ${JWT_KEY:?JWT_KEY is required (token signing key, VPS .env only)}
      Google__ClientId: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
      Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET is required (VPS .env only)}
      AdminSeed__Emails: ${ADMIN_SEED_EMAILS:-}
      Typesense__ApiKey: ${TYPESENSE_API_KEY:?TYPESENSE_API_KEY is required (VPS .env only)}
      Smtp__Password: ${SMTP_PASSWORD:?SMTP_PASSWORD is required (VPS .env only)}
    volumes:
      - dataprotection-keys:/keys
    labels:
      - traefik.enable=true
      # Priorities are EXPLICIT (api=10, web=1): rule-length tiebreaking is
      # not a contract.
      - traefik.http.routers.api-secure.rule=Host(`smartcrops.fr`) && (PathPrefix(`/api`) || Path(`/signin-google`) || Path(`/health`))
      - traefik.http.routers.api-secure.entrypoints=websecure
      - traefik.http.routers.api-secure.tls.certresolver=le
      - traefik.http.routers.api-secure.priority=10
      - traefik.http.routers.api-secure.middlewares=hsts
      - traefik.http.services.api.loadbalancer.server.port=8080
      # Declared once, referenced by every router.
      - traefik.http.middlewares.hsts.headers.stsSeconds=31536000
      - traefik.http.middlewares.hsts.headers.stsIncludeSubdomains=true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      typesense:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  web:
    image: ghcr.io/alexandre-cerveau-audebeau/smartcrops-web:${IMAGE_TAG:?IMAGE_TAG is required (GHCR image tag to deploy)}
    labels:
      - traefik.enable=true
      - traefik.http.routers.web-secure.rule=Host(`smartcrops.fr`)
      - traefik.http.routers.web-secure.entrypoints=websecure
      - traefik.http.routers.web-secure.tls.certresolver=le
      - traefik.http.routers.web-secure.priority=1
      - traefik.http.routers.web-secure.middlewares=hsts
      # www is answered with a real certificate, then permanently redirected
      # to the apex ($$ escapes compose interpolation).
      - traefik.http.routers.www-secure.rule=Host(`www.smartcrops.fr`)
      - traefik.http.routers.www-secure.entrypoints=websecure
      - traefik.http.routers.www-secure.tls.certresolver=le
      - traefik.http.routers.www-secure.middlewares=redirect-www
      - traefik.http.middlewares.redirect-www.redirectregex.regex=^https://www\.smartcrops\.fr/(.*)
      - traefik.http.middlewares.redirect-www.redirectregex.replacement=https://smartcrops.fr/$${1}
      - traefik.http.middlewares.redirect-www.redirectregex.permanent=true
      - traefik.http.services.web.loadbalancer.server.port=80
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging: *default-logging

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartcrops
      POSTGRES_USER: smartcrops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (database password, VPS .env only)}
    volumes:
      - db-data:/var/lib/postgresql/data
    # NO ports: 5432 never leaves the bridge network. The SMA-366 deferral
    # (no SslMode on the discrete path yet) rests on exactly this — the
    # database is reachable only by containers on this compose network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartcrops -d smartcrops"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  typesense:
    image: typesense/typesense:30.2
    environment:
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:?TYPESENSE_API_KEY is required (VPS .env only)}
      TYPESENSE_DATA_DIR: /data
    volumes:
      - typesense-data:/data
    healthcheck:
      # retries 5: the engine transiently replays {"ok":false} while opening
      # its store — a known cold-start artifact, not a failure.
      test: ["CMD-SHELL", "curl -f http://localhost:8108/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

volumes:
  db-data:
  typesense-data:
  letsencrypt:
  # SMA-367 — the DataProtection key ring is NOT encrypted at rest, as a
  # DOCUMENTED PLATFORM CONTROL, not an oversight:
  #   - the ring lives in this single-host named volume only; the host path
  #     is root-owned (/var/lib/docker/volumes), and the only reader is the
  #     api container's app user — the volume boundary IS the control;
  #   - Lot 4 proves the permission posture on the VPS (root-only host dir,
  #     no other container mounting it) as part of the deployment battery;
  #   - the TRIGGER that flips this decision: the moment keys leave the
  #     single root-controlled volume (a second host, an off-site backup of
  #     the volume, a shared filesystem), at-rest encryption (SMA-367)
  #     stops being deferrable and must land BEFORE that move ships.
  dataprotection-keys:
