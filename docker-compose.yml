services:
  db:
    image: postgres:16-alpine
    container_name: smartcrops-db
    environment:
      POSTGRES_DB: smartcrops
      POSTGRES_USER: smartcrops
      # SMA-355 — dev DB password. Set the real value in
      # docker-compose.override.yml (gitignored); the port is published to the
      # host, so a committed password here is a public credential on any
      # untrusted network. Postgres only reads this when the
      # smartcrops-db-data volume is first initialized — an existing volume
      # keeps the password it was created with.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    ports:
      - "5432:5432"
    volumes:
      - smartcrops-db-data:/var/lib/postgresql/data

  api:
    build:
      context: ./src/backend
      dockerfile: SmartCrops.Api/Dockerfile
    container_name: smartcrops-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # SMA-355 — the DB password must match the db service's
      # POSTGRES_PASSWORD. Set the real string in docker-compose.override.yml
      # (gitignored), or supply POSTGRES_PASSWORD via .env (gitignored) so the
      # substitution below fills it in.
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=smartcrops;Username=smartcrops;Password=${POSTGRES_PASSWORD:-}"
      # SMA-355 — HS256 key signing every API session token. Set the real
      # value in docker-compose.override.yml (gitignored); an empty value
      # fails the API boot via the Program.cs JWT guard (same contract as the
      # Typesense/Smtp keys). The literal that used to sit here passed
      # gitleaks AND trufflehog — a hand-written readable string falls below
      # their entropy floor — so no scanner will flag a regression: never
      # commit a value here.
      Jwt__Key: ${JWT_KEY:-}
      Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      # SMA-33/#68 — CSV of emails granted the backend "Admin" role at boot
      # (idempotent, additive-only; never auto-revokes). Each listed account must
      # already exist AND be email-confirmed to be granted. Set the real value in
      # docker-compose.override.yml (gitignored); empty default = no admin seeded.
      AdminSeed__Emails: ${ADMIN_SEED_EMAILS:-}
      # SMA-255 — Typesense admin API key for indexing/search. Set the real
      # value in docker-compose.override.yml (gitignored); an empty value fails
      # the API boot via ValidateOnStart (same contract as the Perenual/Trefle
      # keys).
      Typesense__ApiKey: ${TYPESENSE_API_KEY:-}
      # SMA-30 — OVH SMTP password for the transverse email service (contact
      # form; future account emails SMA-31). Set the real value in
      # docker-compose.override.yml (gitignored); an empty value fails the API
      # boot via ValidateOnStart (same contract as the Typesense/Trefle keys).
      Smtp__Password: ${SMTP_PASSWORD:-}
    ports:
      - "5000:8080"
    depends_on:
      - db

  web:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: smartcrops-web
    environment:
      - VITE_API_URL=http://api:8080
      - VITE_AUTH_API_URL=http://localhost:5000
      # SMA-33/#68: admin UI is now gated by the backend "Admin" role surfaced via
      # GET /api/auth/me (user.isAdmin), not a front whitelist. The former
      # VITE_ADMIN_EMAILS var was removed; configure AdminSeed__Emails on the api
      # service instead.
    ports:
      - "3000:5173"
    depends_on:
      - api

  typesense:
    image: typesense/typesense:30.2
    container_name: smartcrops-typesense
    ports:
      - "8108:8108"
    environment:
      # TYPESENSE_API_KEY is required and supplied via the gitignored
      # docker-compose.override.yml — never commit it here.
      - TYPESENSE_DATA_DIR=/data
    volumes:
      - smartcrops-typesense-data:/data

volumes:
  smartcrops-db-data:
  smartcrops-typesense-data:
