services:
  db:
    image: postgres:16-alpine
    container_name: smartcrops-db
    environment:
      POSTGRES_DB: smartcrops
      POSTGRES_USER: smartcrops
      POSTGRES_PASSWORD: smartcrops_dev
    ports:
      - "5432:5432"
    volumes:
      - smartcrops-db-data:/var/lib/postgresql/data

  api:
    build:
      context: ./src/backend
      dockerfile: SmartCrops.Api/Dockerfile
    container_name: smartcrops-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=smartcrops;Username=smartcrops;Password=smartcrops_dev"
      Jwt__Key: "SmartCrops-Dev-Secret-Key-Change-In-Production-Min32Chars!"
      Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
    ports:
      - "5000:8080"
    depends_on:
      - db

  web:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: smartcrops-web
    environment:
      - VITE_API_URL=http://api:8080
      - VITE_AUTH_API_URL=http://localhost:5000
      # Comma-separated emails (case-insensitive, no spaces around commas)
      # granted access to the admin re-enrichment buttons in PlantDetail.
      # Example: "alice@example.com,bob@example.com".
      # UI-only gate — backend admin endpoints still authorise against
      # [Authorize]. Set the real value in docker-compose.override.yml
      # (gitignored) or via a host env var; empty default means "no admin UI".
      # Replace with ASP.NET Identity Roles when available (#68).
      - VITE_ADMIN_EMAILS=${VITE_ADMIN_EMAILS:-}
    ports:
      - "3000:5173"
    depends_on:
      - api

volumes:
  smartcrops-db-data:
