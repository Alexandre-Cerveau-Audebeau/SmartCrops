# CD (Lot 3 of the deployment chantier, SMA-41). Push-is-publish: on main,
# the newest green-CI push builds both prod images, pushes them to GHCR
# tagged sha-<commit>, and deploys that exact commit to the VPS over SSH.
# Images are PULLED by the VPS, never built there (1 vCPU). A red deploy
# NEVER rolls back automatically — rollback.yml is the operator's button.
#
# Template-injection hygiene (R1): no ${{ }} is ever inlined inside run:
# shell text in this file — the expansion happens BEFORE the shell parses
# anything, so every dynamic value routes through step-level env: and is
# referenced as "$VAR", making the substitution boundary explicit.
#
# FIRST-RUN REALITIES — documented, deliberately NOT solved here:
#   - Lot 4 runbook: the deploy public key must be installed in the VPS
#     authorized_keys before the first run, or every SSH step below fails.
#   - Lot 4 runbook: GHCR packages are created PRIVATE on first push — set
#     them public after the first run, or the VPS pull fails.
#   - Lot 4 runbook: the Let's Encrypt certificate cannot issue before DNS
#     points at the VPS.
#   - Lot 4 runbook: the first boot restores the selective dump BEFORE
#     `up`, so the seeder no-ops instead of reseeding from scratch.
#   - Lot 4 runbook (SMA-462): the compare-to-production job refuses a
#     VPS with no api container, and it runs before the deploy job — the
#     only one that creates the layout and ships the files. So a new or
#     rebuilt VPS gets, BY HAND, first its layout and its files
#     (/opt/smartcrops with docker-compose.yml, traefik/dynamic.yml and
#     .env), then its first containers — by hand or through rollback.yml,
#     which ships no file — before CD deploys there.
name: CD

# Branch model (SMA-410): main is what production runs; develop
# integrates and no longer publishes — publishing is a fast-forward
# push of develop onto main.
on:
  workflow_run:
    # Character-for-character the `name:` of .github/workflows/ci.yml — a
    # rename there silently orphans this trigger.
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# Deploys QUEUE and are never cancelled mid-flight: interrupting a
# half-applied `compose up` is strictly worse than finishing it and then
# deploying the newer commit. The queue holds NO commit order — GitHub:
# "ordering is not guaranteed"; at most one run waits, and the next
# arrival cancels it — so what keeps production from moving backwards is
# the compare-to-production job, never this queue (SMA-462).
concurrency:
  group: cd-production
  cancel-in-progress: false

# Token hygiene (R1): the workflow default is read-only; packages: write
# lives ONLY on the build-and-push job — the compare-to-production and
# deploy jobs open SSH sessions and never touch GHCR, and the compare API
# needs nothing beyond this default contents: read.
permissions:
  contents: read

jobs:
  build-and-push:
    # Trusted-push gate (R1): `conclusion == success` alone is NOT enough —
    # ci.yml also runs on pull_request, and a fork PR can complete CI with
    # head_branch 'main'. Without the event + repository identity
    # checks, this privileged workflow would check out untrusted code while
    # holding deploy credentials and packages: write.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # This explicit block REPLACES the default set — every unlisted scope
    # drops to none. R2: R1's least-privilege scoping silently starved its
    # own sibling fix (`gh run list` 403'd without actions: read, and every
    # deploy died red at the stale gate). Scopes: contents for the
    # checkout, packages to push GHCR, actions so the stale gate can query
    # workflow runs.
    permissions:
      contents: read
      packages: write
      actions: read
    outputs:
      is_latest: ${{ steps.stale.outputs.is_latest }}
    steps:
      - name: Reject stale runs (newest green CI wins)
        id: stale
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # What this gate is for: the cd-production concurrency group
          # queues by COMPLETION time, not commit order — CI for old commit A
          # finishing after newer commit B must never regress production to
          # A, silently and successfully. This gate is the CHEAP first line:
          # it spares the build of a run it can already prove stale. Every
          # later step in this job, the compare-to-production job and the
          # deploy job gate on this output.
          # Runs are listed by FILE name, never by the workflow's name: the
          # SMA-448 pre-flight (§ 1.6 b, 29/09) measured `--workflow CI`
          # answering wrong, shifting runs (7e64b79 of 22/09, then runs from
          # July) where `--workflow ci.yml` answered right. On 02/10 the name
          # form skipped two deploys in green: CD run 36992125175 and its
          # re-run read 7e64b79 against their own de880f6, while the same
          # query, run locally at the same moment, answered de880f6.
          # The list is an index; the commit graph is the truth. When the
          # listed commit is not this run's, GitHub's compare of the two
          # decides (it needs contents: read, granted above for the
          # checkout): "ahead" — the listed commit is an ANCESTOR of this
          # one, the list lags, this run goes on; "behind" — a newer commit
          # is green, this run is stale and skips; anything else (diverged,
          # identical, no answer) fails RED rather than guessing. What the
          # list can NOT prove is that this run is the newest: its order is
          # undocumented, and a list that misses a newer DEPLOYED commit
          # makes an older one look "ahead" (the #310 review, SMA-462). The
          # authority is production itself: the compare-to-production job
          # reads the commit the VPS runs, and only it lets a deploy through.
          latest=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
            --branch main --event push --status success --limit 1 \
            --json headSha --jq '.[0].headSha')
          # An empty/null answer is an API anomaly, not a verdict: fail RED
          # (re-runnable) instead of silently stranding a genuine deploy
          # behind is_latest=false.
          if [ -z "$latest" ] || [ "$latest" = "null" ]; then
            echo "could not determine the newest green CI run - failing loudly rather than guessing"
            exit 1
          fi
          echo "newest green CI push run on main: $latest"
          echo "this run:                         $HEAD_SHA"
          if [ "$latest" = "$HEAD_SHA" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            relation=$(gh api "repos/$GITHUB_REPOSITORY/compare/$latest...$HEAD_SHA" --jq '.status')
            echo "this run relative to it:          $relation"
            case "$relation" in
              ahead)
                echo "is_latest=true" >> "$GITHUB_OUTPUT"
                echo "the listed run is an ancestor of this one - the list lags; production decides next"
                ;;
              behind)
                echo "is_latest=false" >> "$GITHUB_OUTPUT"
                echo "stale run - a newer green commit exists; skipping every later step"
                ;;
              *)
                echo "neither ahead of nor behind the listed run - failing loudly rather than guessing"
                exit 1
                ;;
            esac
          fi

      - name: Checkout the CI-validated commit
        if: steps.stale.outputs.is_latest == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Pinned to the commit CI actually validated — checking out the
          # branch here would let a LATER push smuggle unvalidated code into
          # this deploy.
          ref: ${{ github.event.workflow_run.head_sha }}
          # Nothing in this job pushes commits: do not leave the scoped
          # token sitting in .git/config for later steps to read.
          persist-credentials: false

      - name: Log in to GHCR
        if: steps.stale.outputs.is_latest == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the api image
        if: steps.stale.outputs.is_latest == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: src/backend
          file: src/backend/SmartCrops.Api/Dockerfile
          push: true
          tags: ghcr.io/alexandre-cerveau-audebeau/smartcrops-api:sha-${{ github.event.workflow_run.head_sha }}

      - name: Build and push the web image
        if: steps.stale.outputs.is_latest == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: src/frontend
          file: src/frontend/Dockerfile.prod
          push: true
          tags: ghcr.io/alexandre-cerveau-audebeau/smartcrops-web:sha-${{ github.event.workflow_run.head_sha }}

  compare-to-production:
    # SMA-462 — never deploy backwards. The list gate above is an index of
    # CI runs: it cannot prove that no NEWER commit already serves (the
    # #310 review). This job reads the commit the VPS actually runs and
    # lets the deploy through only if this run IS that commit or descends
    # from it. It changes nothing on the VPS, and it runs before the deploy
    # job touches anything (files, dump, containers). The cd-production
    # group holds a run only while it runs: within ONE attempt no other
    # deploy or rollback can move production between this read and the
    # deploy — only a human could. Between two attempts nothing holds it,
    # and a partial re-run that leaves this job out ("Re-run failed jobs"
    # once it has succeeded, or the deploy job alone) executes deploy on
    # THIS job's outputs of an earlier attempt, without reading production
    # again: so deploy re-reads it first, in its freshness step, against
    # the `production` output below.
    # A job of its own, not a step of deploy: its "no" skips the WHOLE
    # deploy job, so no deploy step — today's or a future one — can run
    # uncleared, and no per-step if: can be forgotten.
    needs: build-and-push
    if: needs.build-and-push.outputs.is_latest == 'true'
    runs-on: ubuntu-24.04
    # Bounded like every job of the shared queue: the reads below take
    # seconds, and every ssh inherits the liveness options of the shared
    # bootstrap's ~/.ssh/config.
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.compare.outputs.proceed }}
      production: ${{ steps.compare.outputs.production }}
    steps:
      - name: Checkout the CI-validated commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Only to load the shared SSH action — the same pin as deploy, so
          # both jobs run the action of the commit being deployed.
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Bootstrap SSH (shared action, pinned host key)
        uses: ./.github/actions/ssh-health-gate
        with:
          mode: bootstrap
          ssh_key: ${{ secrets.DEPLOY_SSH_KEY }}
          host_key: ${{ vars.VPS_HOST_KEY }}
          vps_user: ${{ vars.VPS_USER }}
          vps_host: ${{ vars.VPS_HOST }}

      - name: Compare the candidate to the commit in production
        id: compare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # READ-ONLY on the VPS. The commit in production is the tag of the
          # api container's image: build-and-push tags every image
          # sha-<commit>, compose creates the container from that exact
          # reference, and Config.Image keeps it "as it was passed by the
          # operator" (Docker's own definition), whatever later happens to
          # the tag. The name is compose's <project>-<service>-<index>, the
          # project being the /opt/smartcrops directory, as for the dump's
          # volume name. The api, not the web, is the reference: D17 moves
          # the api first on a deploy and last on a rollback, so a deploy, or
          # a rollback to an older tag, that stops half-way leaves the api
          # on the NEWER of the two commits. The web is read for the log only.
          if ! api=$(ssh vps "docker container inspect --format '{{.State.Status}} {{.Config.Image}}' smartcrops-api-1"); then
            echo "could not read the api container in production - failing loudly rather than guessing"
            echo "(no api container at all is a runbook case: a new or rebuilt VPS - SMA-462)"
            exit 1
          fi
          web=$(ssh vps "docker container inspect --format '{{.State.Status}} {{.Config.Image}}' smartcrops-web-1" 2>&1) || web="unreadable: $web"
          # One log line per remote answer, whatever it holds: a newline or a
          # carriage return in it would put the VPS's own text at the start
          # of a log line, where the runner reads workflow commands. Only the
          # printed copy is flattened — every decision below reads the raw
          # answer, so an answer of several lines stays red.
          api_line=${api//[$'\r\n']/ }
          web_line=${web//[$'\r\n']/ }
          echo "production, api container:  $api_line"
          echo "production, web container:  $web_line"
          echo "this run:                   $HEAD_SHA"
          # A stopped api is a production in the middle of an operation:
          # rollback.yml's restore stops it, and keeps it stopped until its
          # replay succeeded — a deploy now would start a new api on
          # whatever database that left. running, and restarting (the crash
          # loop of a red health gate, which a fix-forward exists for), go
          # on; any other state is red.
          state=${api%% *}
          image=${api#* }
          case "$state" in
            running|restarting) ;;
            *)
              state_line=${state//[$'\r\n']/ }
              echo "the api container is '$state_line', not running - failing loudly rather than guessing"
              exit 1
              ;;
          esac
          # Exactly the reference this workflow publishes (the api image
          # line of docker-compose.prod.yml): latest, a digest, a short sha
          # or another owner is a production this CD did not make.
          tag_re='^ghcr[.]io/alexandre-cerveau-audebeau/smartcrops-api:sha-([0-9a-f]{40})$'
          if [[ ! "$image" =~ $tag_re ]]; then
            echo "the api image is not a sha-<40> tag this CD publishes - failing loudly rather than guessing"
            exit 1
          fi
          production=${BASH_REMATCH[1]}
          # Recorded for the deploy job's freshness step: the 40 characters
          # the expression just captured, written before the comparison. A
          # partial re-run hands them to deploy as they are, and deploy
          # checks production against them before it changes anything.
          echo "production=$production" >> "$GITHUB_OUTPUT"
          # BASE...HEAD = production...this run. Asked even when both are
          # the same commit: the same-version replay is how this job gets
          # proven in production. On an HTTP error, gh prints the error body
          # on stdout and exits non-zero — the exit code decides, never the
          # text.
          if ! relation=$(gh api "repos/$GITHUB_REPOSITORY/compare/$production...$HEAD_SHA" --jq '.status'); then
            echo "GitHub could not compare the two commits - failing loudly rather than guessing"
            exit 1
          fi
          echo "this run relative to it:    $relation"
          case "$relation" in
            ahead)
              echo "proceed=true" >> "$GITHUB_OUTPUT"
              echo "this run descends from the commit in production - deploying"
              ;;
            identical)
              echo "proceed=true" >> "$GITHUB_OUTPUT"
              echo "this run is the commit in production - redeploying it"
              ;;
            behind)
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              echo "::notice title=Deploy skipped::production runs $production, a descendant of this run - nothing was touched"
              ;;
            *)
              echo "neither ahead of, identical to nor behind production - failing loudly rather than guessing"
              exit 1
              ;;
          esac

  deploy:
    # Skipped transitively on red/untrusted CI (build-and-push guard) and
    # on a red production read; explicitly on stale runs (the is_latest
    # output) and on runs older than the commit in production (the proceed
    # output, SMA-462). Both outputs belong to the attempt that wrote them:
    # a partial re-run of this job only ("Re-run failed jobs" when it alone
    # failed, or this job alone) executes it on the outputs of an EARLIER
    # attempt, and neither gate runs again. Hence the freshness step below,
    # ahead of every step that changes the VPS: it reads production again,
    # and stops red if it moved.
    needs: [build-and-push, compare-to-production]
    if: needs.build-and-push.outputs.is_latest == 'true' && needs.compare-to-production.outputs.proceed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout the CI-validated commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Same pin as build-and-push: the compose and routing files shipped
          # below come from the exact commit whose images were just built.
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Bootstrap SSH (shared action, pinned host key)
        uses: ./.github/actions/ssh-health-gate
        with:
          mode: bootstrap
          ssh_key: ${{ secrets.DEPLOY_SSH_KEY }}
          host_key: ${{ vars.VPS_HOST_KEY }}
          vps_user: ${{ vars.VPS_USER }}
          vps_host: ${{ vars.VPS_HOST }}

      - name: Confirm production has not moved since the comparison
        env:
          RECORDED_PRODUCTION: ${{ needs.compare-to-production.outputs.production }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # The freshness check (SMA-462, the #315 review). A partial re-run
          # — "Re-run failed jobs" when only this job failed, or this job
          # alone — executes deploy on the outputs of an EARLIER attempt:
          # compare-to-production does not run again, and its old "yes"
          # would let this commit land over whatever another deploy, or a
          # rollback, has put in production since. So deploy reads
          # production again before its first change on the VPS, under the
          # compare step's own rules — the same command, the same two
          # states, the same anchored expression — and goes on in two cases
          # only: production is still the commit that was compared, or it
          # is already this run's commit (the api moves first, so a deploy
          # that stopped half-way leaves it there). Anything else is red.
          # When production moved, or when no compared commit reached this
          # job, the way out is "Re-run all jobs": the run is judged again
          # from the start, by the list gate and then against production.
          # An api that is missing, stopped or on a foreign tag is red
          # there too, until it is repaired (rollback.yml, or by hand).
          # READ-ONLY on the VPS, and no call to GitHub: the only question
          # here is whether production moved.
          if ! api=$(ssh vps "docker container inspect --format '{{.State.Status}} {{.Config.Image}}' smartcrops-api-1"); then
            echo "could not read the api container in production - failing loudly rather than guessing"
            exit 1
          fi
          # One log line per remote answer, as in the compare step; the raw
          # answer decides.
          api_line=${api//[$'\r\n']/ }
          echo "production, api container:  $api_line"
          echo "this run:                   $HEAD_SHA"
          state=${api%% *}
          image=${api#* }
          case "$state" in
            running|restarting) ;;
            *)
              state_line=${state//[$'\r\n']/ }
              echo "the api container is '$state_line', not running - failing loudly rather than guessing"
              exit 1
              ;;
          esac
          # The compare step's own expression: it now lives twice in this
          # file, and a change of registry or owner must change both.
          tag_re='^ghcr[.]io/alexandre-cerveau-audebeau/smartcrops-api:sha-([0-9a-f]{40})$'
          if [[ ! "$image" =~ $tag_re ]]; then
            echo "the api image is not a sha-<40> tag this CD publishes - failing loudly rather than guessing"
            exit 1
          fi
          production=${BASH_REMATCH[1]}
          # What the comparison read: a job output, so 40 hexadecimal
          # characters or nothing this step can rely on.
          sha_re='^[0-9a-f]{40}$'
          if [[ ! "$RECORDED_PRODUCTION" =~ $sha_re ]]; then
            echo "the comparison left no production commit to check against - failing loudly rather than guessing"
            echo 'use "Re-run all jobs": the run is judged again from the start, by the list gate and then against production'
            exit 1
          fi
          echo "compared against:           $RECORDED_PRODUCTION"
          if [ "$production" = "$RECORDED_PRODUCTION" ]; then
            echo "production unchanged since the comparison"
          elif [ "$production" = "$HEAD_SHA" ]; then
            echo "production already runs this commit — a deploy stopped half-way"
          else
            echo "production moved since the comparison: it ran $RECORDED_PRODUCTION then, it runs $production now - failing loudly rather than deploying over it"
            echo 'use "Re-run all jobs", never this job alone: the run is judged again from the start, by the list gate and then against production'
            exit 1
          fi

      - name: Ensure the deployment layout exists
        run: |
          # /opt/smartcrops is the canonical deployment dir: the compose file
          # under its canonical name, the traefik/ routing dir beside it, and
          # backups/ for the pre-deploy dumps. mkdir -p obeys the remote
          # umask — under the default 022 a fresh backups directory is born
          # 0755, and if the step dies between mkdir and chmod, that window
          # PERSISTS (R4). umask-before-mkdir makes the directory born
          # private; the chmod keeps healing pre-existing ones.
          ssh vps 'mkdir -p /opt/smartcrops/traefik && umask 077 && mkdir -p /opt/smartcrops/backups && chmod 700 /opt/smartcrops/backups'

      - name: Ship the compose and routing files
        run: |
          # docker-compose.prod.yml lands as docker-compose.yml so the VPS
          # runs PLAIN `docker compose` — zero -f on the VPS, ever (the
          # project's standing rule; the file rename is how it holds).
          # Atomic landing (R5): an interrupted transfer previously left a
          # partial LIVE file for later MANUAL compose commands — the
          # uploads land on dotted temp names, and ONE ssh performs both
          # mv's only after BOTH uploads succeeded; same atomic discipline
          # as the dumps.
          scp docker-compose.prod.yml vps:/opt/smartcrops/.docker-compose.yml.tmp
          scp traefik/dynamic.yml vps:/opt/smartcrops/traefik/.dynamic.yml.tmp
          ssh vps 'mv /opt/smartcrops/.docker-compose.yml.tmp /opt/smartcrops/docker-compose.yml && mv /opt/smartcrops/traefik/.dynamic.yml.tmp /opt/smartcrops/traefik/dynamic.yml'

      - name: Guarded pre-deploy dump (the ratified rollback floor)
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # pipefail (R1): without it the pipe reports gzip's status — a
          # failed pg_dump would masquerade as the newest "good" backup and
          # the retention line would eat real ones. The dump is written to a
          # dotted .tmp name and only renamed (atomic mv) to a restorable
          # name after success — a half-written dump never bears one; the
          # retention runs AFTER the rename. The db-running guard keeps the
          # FIRST deploy (no db yet) green.
          # Remote-script discipline (R1): the body is ONE brace group so
          # bash parses it fully before executing — `docker compose exec`
          # pumps stdin by default (-T only drops the TTY) and would
          # otherwise drain the yet-unread script lines into the container;
          # </dev/null on the exec states the same intent explicitly.
          # IMAGE_TAG rides the remote env because compose interpolates the
          # prod file's ${IMAGE_TAG:?} on EVERY subcommand (`ps` and `exec`
          # included) — any non-empty value satisfies it; exec targets the
          # RUNNING containers by label, not by the image: field.
          ssh vps "HEAD_SHA=$HEAD_SHA IMAGE_TAG=sha-$HEAD_SHA bash -s" <<'REMOTE'
          {
            set -euo pipefail
            # umask 077 (R3): every file born below is 0600. The default
            # 022 births 0644 dumps — a full-database export readable by
            # ANY local user.
            umask 077
            cd /opt/smartcrops
            # Self-healing normalize (R3): files created BEFORE this fix
            # (or by hand) are pulled back to 0600 too. find is
            # no-match-safe under set -e, unlike a bare glob chmod.
            find backups -maxdepth 1 -name '*.sql.gz' -exec chmod 600 {} +
            # The dump trigger is DATA EXISTENCE, not container liveness
            # (R5): `ps --status running` missed a STOPPED db with live
            # data — the next deploy would have migrated real state WITHOUT
            # a rollback floor. The volume name derives from the compose
            # project name, which is the deployment directory name
            # (/opt/smartcrops -> project "smartcrops" -> smartcrops_db-data).
            if docker volume inspect smartcrops_db-data >/dev/null 2>&1; then
              # Self-healing (start + wait + dump) beats fail-closed here:
              # the deploy's own `up -d` would have started this db seconds
              # later anyway. IMAGE_TAG already rides the remote env for
              # every compose subcommand, including this up.
              docker compose up -d db
              # Bounded readiness wait: pg_isready INSIDE the container
              # (the /dev/tcp probe belongs to the compose healthcheck, not
              # this script). Loud failure on timeout — no silent
              # floor-less deploy.
              ready=0
              for i in $(seq 1 12); do
                if docker compose exec -T db pg_isready -U smartcrops -d smartcrops </dev/null >/dev/null 2>&1; then
                  ready=1
                  break
                fi
                echo "waiting for db readiness ($i/12)"
                sleep 5
              done
              if [ "$ready" -ne 1 ]; then
                echo "db did not become ready within 60s - cannot take the rollback floor"
                exit 1
              fi
              # Stale temps from previous FAILED runs are swept before
              # dumping (R3) — repeated failures would otherwise fill the
              # disk that then blocks deploys AND rollbacks. Scoped to THIS
              # site's dotted prefix; never the rollback site's, never
              # final files.
              rm -f -- backups/.pre-deploy-*.sql.gz.tmp
              dump_start=$(date +%s)
              ts=$(date -u +%Y%m%dT%H%M%SZ)
              tmp="backups/.pre-deploy-${HEAD_SHA}-${ts}.sql.gz.tmp"
              final="backups/pre-deploy-${HEAD_SHA}-${ts}.sql.gz"
              # EXIT-trap lifecycle (R3): registered AFTER tmp is set.
              # Single quotes are correct — "$tmp" resolves at FIRE time,
              # and tmp never changes afterwards. Any failure below removes
              # its own temp.
              trap 'rm -f -- "$tmp"' EXIT
              docker compose exec -T db pg_dump -U smartcrops smartcrops </dev/null | gzip > "$tmp"
              mv "$tmp" "$final"
              # Cleared IMMEDIATELY after the mv: a later failure in this
              # script can never delete the now-final dump.
              trap - EXIT
              # Duration on the record: a future dump-approaching-the-job-
              # timeout diagnosis should read one log line, not re-derive it.
              echo "pre-deploy dump ${final} took $(( $(date +%s) - dump_start ))s"
              ls -1t backups/pre-deploy-*.sql.gz | tail -n +8 | xargs -r rm
            else
              echo "db volume absent - true first deploy, nothing to dump"
            fi
          }
          REMOTE

      - name: Deploy the api first (server before client)
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # IMAGE_TAG is supplied INLINE: shell env beats .env in compose
          # precedence, so the VPS .env keeps holding ONLY its secret values
          # and is never rewritten by a deploy. The flip side of that
          # contract: EVERY remote compose invocation in this pipeline must
          # carry IMAGE_TAG itself — interpolation of ${IMAGE_TAG:?} runs
          # for ps/stop/exec too, not just pull/up.
          # Server before client (D17, SMA-447 § 7): a NEW web in front of
          # the OLD api breaks — the routes and fields it relies on do not
          # exist yet. One `up` for both images held no order at all: web
          # has no depends_on and started BEFORE the api on 24/09 (run
          # 36067826925). So (1) every image is pulled before anything
          # moves; (2) the data plane and the edge converge first, WAITED
          # healthy within a bound — `--no-deps api` below skips the
          # depends_on conditions that used to hold the api back; (3) ONLY
          # the api is recreated, and its boot applies the migrations before
          # Kestrel listens. The web keeps serving the previous client until
          # the health gate below is green.
          ssh vps "cd /opt/smartcrops && IMAGE_TAG=sha-$HEAD_SHA docker compose pull && IMAGE_TAG=sha-$HEAD_SHA docker compose up -d --wait --wait-timeout 120 --no-deps db typesense traefik && IMAGE_TAG=sha-$HEAD_SHA docker compose up -d --no-deps api"

      - name: Health gate (shared action, DNS-independent)
        uses: ./.github/actions/ssh-health-gate
        with:
          mode: health-gate
          image_tag: sha-${{ github.event.workflow_run.head_sha }}

      - name: Deploy the web last (after the api is healthy)
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Reached ONLY after a green health gate: a red gate stops the job
          # before this step and leaves the PREVIOUS web in front of the new
          # api — the old-client/new-server pair every additive server change
          # is built to serve. The pre-SMA-447 command, unchanged: it
          # converges what is left (the web, and any service not named above)
          # and removes orphans; db, typesense, traefik and the api are
          # already at target and stay Running — Compose keeps depends_on out
          # of its config hash (v2.29.3+), so the --no-deps call above cannot
          # make this one recreate them.
          ssh vps "cd /opt/smartcrops && IMAGE_TAG=sha-$HEAD_SHA docker compose up -d --remove-orphans"
