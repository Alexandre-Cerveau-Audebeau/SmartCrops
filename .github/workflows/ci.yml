# Runners pinned to ubuntu-24.04 (SMA-447 § 1, 22/09/2026) — here, in cd.yml
# and in rollback.yml. The floating `latest` Ubuntu label moves to 26.04 from
# 19 October 2026 (https://github.com/actions/runner-images/issues/14748),
# and the « Chrome for the layout harness » step below — Google's APT
# repository, the headless browser's packages on a new distribution — could
# break there, on every PR. Re-evaluate once the layout harness has been run
# green on an ubuntu-26.04 runner (Chrome found, 30 scenes at zero); then
# move the three workflows together, never one at a time.
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  backend:
    name: Backend (.NET 8)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore SmartCrops.sln

      - name: Check formatting
        run: dotnet format SmartCrops.sln --verify-no-changes

      - name: Build
        run: dotnet build SmartCrops.sln --no-restore

      - name: Test (unit + component)
        run: dotnet test SmartCrops.sln --no-build --filter "Category!=Integration"
        timeout-minutes: 15

      - name: Test (integration — Testcontainers PG)
        run: dotnet test SmartCrops.sln --no-build --filter "Category=Integration"
        timeout-minutes: 20

  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: src/frontend

      - name: Lint
        run: npm run lint
        working-directory: src/frontend

      # SMA-336 mobile lot (D7): the dashboard layout suite measures the
      # widgets in Chrome headless (src/frontend/src/test/layout). The runner
      # image ships Google Chrome; this step FAILS the job if it is missing and
      # hands its path to the suite, which never skips when CI is set.
      - name: Chrome for the layout harness
        run: |
          google-chrome --version
          echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"

      - name: Test
        run: npm test
        working-directory: src/frontend

      - name: Build
        run: npm run build
        working-directory: src/frontend
