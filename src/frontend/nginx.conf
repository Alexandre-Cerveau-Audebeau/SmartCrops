# SPA serving contract (Lot 2). Traefik terminates TLS and owns the edge;
# this server only ever sees plain HTTP on the bridge network.
server {
    # 8080: the unprivileged image binds a non-root port (R1).
    listen 8080;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers (R1). nginx INHERITANCE RULE: a location that declares
    # ANY add_header of its own inherits NOTHING from server level — so these
    # three are deliberately REPEATED inside every add_header-bearing
    # location below. Do not "clean up the duplication": removing them there
    # silently strips the headers from exactly those responses.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # The entry document must always be revalidated: it is the only file
    # whose name never changes, and it is what points at the hashed assets.
    location = /index.html {
        add_header Cache-Control "no-cache";
        # Repeated on purpose — see the inheritance rule above.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Hashed assets are immutable by construction — cache them for a year.
    # And a MISSING hashed file must 404 LOUDLY: falling back to index.html
    # here would serve HTML as JS after a bad deploy and produce
    # unfathomable console errors instead of a visible failure.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Repeated on purpose — see the inheritance rule above.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Everything else is a client-side route: hand it to the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
