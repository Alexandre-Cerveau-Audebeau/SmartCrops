# SPA serving contract (Lot 2). Traefik terminates TLS and owns the edge;
# this server only ever sees plain HTTP on the bridge network.
server {
    listen 80;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # The entry document must always be revalidated: it is the only file
    # whose name never changes, and it is what points at the hashed assets.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Hashed assets are immutable by construction — cache them for a year.
    # And a MISSING hashed file must 404 LOUDLY: falling back to index.html
    # here would serve HTML as JS after a bad deploy and produce
    # unfathomable console errors instead of a visible failure.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Everything else is a client-side route: hand it to the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
