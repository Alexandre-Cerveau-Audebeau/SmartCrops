<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="えりな J">
  <title>えりな J</title>
  <!--
    SMA-394 — our own artwork, no photograph and no third-party asset, so the
    card carries no credit or licence line. Same 400x400 box as
    PLANT_HERO_PLACEHOLDER (utils/plantDetail.ts) so the card grid cannot
    shift. Colours are the theme's brand greens: #4CAF78 is primary.light and
    the exact green of the placeholder; the text is the placeholder's white.
    The font-family carries the JP fallback stack because an SVG loaded via
    <img> cannot use the app's self-hosted Inter, and Inter has no kana.
  -->
  <rect width="400" height="400" fill="#4CAF78"/>
  <text x="200" y="200" fill="#ffffff" font-family="Inter, 'Hiragino Sans', 'Yu Gothic UI', Meiryo, 'Noto Sans JP', sans-serif" font-size="86" font-weight="700" text-anchor="middle" dominant-baseline="central">えりな J</text>
</svg>
