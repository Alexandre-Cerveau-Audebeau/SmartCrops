# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# NE JAMAIS ajouter `knowledge_base.opt_out: true` — cela EFFACE IRRÉVERSIBLEMENT
# tous les learnings CodeRabbit (doc officielle confirmée). Pour ajuster le
# knowledge base, utiliser les champs de scope (ex. knowledge_base.learnings.scope),
# jamais opt_out.
reviews:
  profile: assertive
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  sequence_diagrams: true
  auto_review:
    enabled: true
    base_branches:
      - main
      - develop
  path_instructions:
    - path: "src/backend/**/*.cs"
      instructions: "Focus on architectural patterns, dependency management, security, and system design impact."
    - path: "src/frontend/src/**/*.tsx"
      instructions: "Focus on component architecture, accessibility, state management patterns, and performance."
    - path: "src/frontend/src/**/*.ts"
      instructions: "Focus on type safety, API design, and error handling patterns."
    - path: ".claude/skills/**/*.ps1"
      instructions: "PowerShell scripts for Windows-specific Claude Code tooling. Focus on error handling, idempotency, and clear stop-and-report conditions on edge cases. Do NOT suggest cross-platform refactors — these scripts are Windows-only by design (workspace storage paths use %APPDATA%, gh CLI runs natively). Do NOT suggest replacing PowerShell with Bash. Moderate PSScriptAnalyzer suggestions: respect SmartCrops's intentional PowerShell-only tooling choices."
    - path: ".claude/skills/**/SKILL.md"
      instructions: "Skill discovery entry points. Focus on (1) frontmatter completeness — `name` and `description` are required; the description must be specific and trigger-rich for skill discovery; (2) instruction clarity for another Claude instance to follow; (3) progressive disclosure — keep SKILL.md lean (~1500-2000 words), put detailed content in references/. Do not suggest restructuring unless it violates the Claude Code skill standard."
    - path: ".claude/skills/**/README.md"
      instructions: "Human-readable skill documentation. NO frontmatter required — README is not a skill discovery entry point. Focus on (1) clarity of the quick-start, (2) accuracy of the file-tree description, (3) maintenance-of-truth with the actual SKILL.md and scripts."
    - path: ".claude/skills/**/references/*.md"
      instructions: "Reference documentation loaded on-demand by the skill. NO frontmatter required. Focus on (1) accuracy with respect to the implementing script, (2) completeness of edge cases, (3) examples that match the actual data shape."
    - path: "docs/adr/*.md"
      instructions: "Architectural Decision Records. Focus on completeness of Status/Date/Deciders/Context/Decision/Rationale/Consequences/When to revisit/Related sections. Verify fenced code blocks have language identifiers (markdownlint MD040). Do not suggest restructuring unless ADR-0001 sets a different precedent."
    - path: "docs/coding-guidelines.md"
      instructions: "Canonical project conventions document linked from CodeRabbit's Knowledge Base. Focus on (1) internal consistency between sections, (2) accuracy with respect to current codebase practices, (3) completeness for new contributor onboarding. Do not suggest expanding scope beyond what already exists — this is a working conventions doc, not a comprehensive style guide."
    - path: "scripts/**/*.ps1"
      instructions: "Client-side admin/dev scripts (PowerShell). When the script mirrors a backend constant or sensible default (e.g., MaxCandidates, TimeoutSec, batch limits), prefer a hardcoded literal with a maintenance comment pointing at the C# const path. Do NOT propose (a) introducing a metadata endpoint or custom HTTP header (e.g., /metadata, X-MaxCandidates) to fetch the value at runtime, nor (b) parameterizing the value via a script parameter (e.g., [ValidateRange]) when no caller has asked for the knob. Authoritative enforcement is server-side (HTTP 400 / explicit error); client-side ValidateRange/defaults are fail-fast UX, not enforcement. PR #89 (SMA-45) rounds 3-5 confirmed this stance after 3 consecutive declines on MaxCandidates/TimeoutSec mirroring proposals."
    - path: "scripts/**/*.sh"
      instructions: "Same guidance as scripts/**/*.ps1 for bash scripts: prefer hardcoded literals + maintenance comment over runtime metadata fetches or unnecessary parameterization when mirroring backend constants. Server-side enforcement is authoritative; client-side validation is fail-fast UX."
  path_filters:
    - "!.postman/**"
    - "!postman/**"
    - "!**/*.postman_*.json"
    - "!/tmp/harvest-*.json"
tone_instructions: "Provide architectural insights on system design, scalability, and long-term maintainability. Be specific with code suggestions."
